<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#1c8fd6"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="KFU Work"><script src="https://telegram.org/js/telegram-web-app.js"></script><title>KFU Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>[hidden]{display:none!important}
/* Telegram-Wallet-style Mini App. Telegram theme params inside Telegram, light/dark fallbacks outside. */
:root{
  --bg:var(--tg-theme-secondary-bg-color,#f1f1f4); --card:var(--tg-theme-section-bg-color,#fff); --ink:var(--tg-theme-text-color,#000);
  --hint:var(--tg-theme-hint-color,#8a8a8e); --accent:var(--tg-theme-button-color,#2AABEE); --accent-ink:var(--tg-theme-button-text-color,#fff);
  --sep:#e6e6eb; --ok:#34c759; --hot:#ff3b30; --warn:#ff9f0a; --f:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:var(--tg-theme-secondary-bg-color,#1c1c1d);--card:var(--tg-theme-section-bg-color,#2c2c2e);--ink:var(--tg-theme-text-color,#fff);--hint:var(--tg-theme-hint-color,#98989f);--sep:#3a3a3c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1c1d;--card:#2c2c2e;--ink:#fff;--hint:#98989f;--sep:#3a3a3c;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45}
button{font-family:var(--f)}
.app{max-width:480px;margin:0 auto;min-height:100%;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.view{padding:12px 16px 104px}
.view[hidden]{display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 2px 8px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px}
.brand img{width:30px;height:30px;display:block}
.top h1{font-size:20px;margin:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:color-mix(in srgb,var(--hint) 16%,transparent);border-radius:11px;padding:2px;margin:2px 0 6px}
.seg button{border:0;background:none;color:var(--ink);font:600 13px var(--f);padding:7px 4px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:800}
.earn{text-align:center;padding:14px 0 2px}
.earn small{color:var(--hint);font-size:13px}
.earn b{display:block;font-size:40px;font-weight:800;letter-spacing:-.03em;margin-top:2px;font-variant-numeric:tabular-nums}
.earn b span{font-size:20px;color:var(--hint)}
.goal{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--hint);margin-top:6px}
.gb{width:120px;height:6px;border-radius:9px;background:var(--sep);overflow:hidden}
.gb i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .4s}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0;text-align:center}
.act{background:none;border:0;color:var(--ink);font:600 12px var(--f);cursor:pointer;padding:0}
.act i{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 6px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-style:normal;font-size:20px}
.card{background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:16px}
.ai{display:flex;gap:12px;align-items:center;cursor:pointer;width:100%;border:0;text-align:left;color:inherit;font:inherit;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,var(--card)),var(--card))}
.ai .e{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:19px;flex:0 0 40px}
.ai b{display:block;font-size:15px}.ai span{font-size:13px;color:var(--hint)}
.tip{display:flex;gap:12px;align-items:flex-start}
.tip .e{font-size:22px;line-height:1}
.tip b{display:block;font-size:14px}.tip span{font-size:13px;color:var(--hint)}
.tip button{margin-left:auto;background:none;border:0;color:var(--accent);font:700 13px var(--f);cursor:pointer;white-space:nowrap}
.gh{font-size:13px;color:var(--hint);text-transform:uppercase;letter-spacing:.03em;font-weight:600;padding:0 4px 7px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.gh button{background:none;border:0;color:var(--accent);font:600 13px var(--f);cursor:pointer;text-transform:none;letter-spacing:0;padding:0}
.grp{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:16px}
.rw{display:flex;align-items:center;border-bottom:1px solid var(--sep)}
.rw:last-child{border-bottom:0}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px 11px 14px;width:100%;background:none;border:0;color:inherit;text-align:left;font:inherit;cursor:pointer;min-width:0}
.row.static{cursor:default}
.ri{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:0 0 38px;color:#fff;font-weight:800;font-size:15px}
.ri.round{border-radius:50%}
.rt{flex:1;min-width:0}
.rt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt span{font-size:12.5px;color:var(--hint)}
.bdge{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:6px;margin-right:5px;vertical-align:1px}
.hotb{background:rgba(255,59,48,.14);color:var(--hot)}
.newb{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.okb{background:rgba(52,199,89,.16);color:#1f9d45}
.wb{background:rgba(255,159,10,.16);color:#c77700}
.rp{text-align:right;font-weight:800;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.rp span{display:block;font-size:11.5px;color:var(--hint);font-weight:600}
.rp.plus{color:#1f9d45}
.fav{background:none;border:0;cursor:pointer;color:var(--hint);padding:10px 12px 10px 4px;font-size:18px;line-height:1}
.fav[aria-pressed="true"]{color:var(--hot)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:0 12px;margin-bottom:10px}
.search input{flex:1;border:0;background:none;color:var(--ink);font:500 15px var(--f);padding:11px 0;outline:none;min-width:0}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:0 0 auto;border:0;border-radius:999px;padding:8px 14px;font:600 13.5px var(--f);background:var(--card);color:var(--ink);cursor:pointer}
.sheet .chip{background:var(--bg)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sort{display:flex;gap:6px;margin-bottom:12px}
.sort button{flex:1;border:0;border-radius:10px;padding:8px;font:600 12.5px var(--f);background:var(--card);color:var(--hint);cursor:pointer}
.sort button[aria-pressed="true"]{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--accent)}
.empty{text-align:center;color:var(--hint);padding:24px 14px;font-size:14px}
/* passport card, mirrors the site's Career Passport */
.pass{border-radius:18px;padding:16px;margin-bottom:16px;color:#fff;background:linear-gradient(140deg,#1c8fd6,#0b3b66);position:relative;overflow:hidden}
.pass:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.pass .ph{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.08em;opacity:.85;font-weight:700}
.pass .pm{display:flex;gap:14px;align-items:center;margin:14px 0 12px}
.pass .av{width:60px;height:60px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800;font-size:22px;flex:0 0 60px}
.pass h2{margin:0;font-size:20px}.pass p{margin:2px 0 0;font-size:13px;opacity:.85}
.pass .ps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;background:rgba(255,255,255,.1);border-radius:12px;padding:9px 4px}
.pass .ps b{display:block;font-size:18px}.pass .ps span{font-size:11px;opacity:.85}
.pass .mrz{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;letter-spacing:.06em;opacity:.7;margin-top:12px;white-space:nowrap;overflow:hidden}
.prog p{margin:0 0 9px;font-size:14px}
.bar{height:8px;border-radius:9px;background:var(--sep);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .4s}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.bdg{font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:999px;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.set{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--sep)}
.set:last-child{border-bottom:0}
.set>span{flex:1}
.set select,.set input[type=text]{border:0;background:var(--bg);color:var(--ink);font:600 14px var(--f);border-radius:9px;padding:7px 10px;max-width:58%}
.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--sep);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:0 0 51px}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.sw:checked{background:var(--ok)}.sw:checked:after{transform:translateX(20px)}
.lnk{background:none;border:0;color:var(--accent);font:600 15px var(--f);cursor:pointer;padding:0;text-align:left;flex:1}
.lnk.red{color:var(--hot)}
/* stage timeline */
.tl{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:10px 0 4px}
.tl i{height:5px;border-radius:5px;background:var(--sep)}
.tl i.on{background:var(--accent)}.tl.fin i{background:var(--ok)}
.tls{list-style:none;margin:12px 0;padding:0}
.tls li{display:flex;gap:10px;align-items:center;padding:6px 0;color:var(--hint);font-size:14px}
.tls li:before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--sep);flex:0 0 12px}
.tls li.d{color:var(--ink)}.tls li.d:before{background:var(--ok);border-color:var(--ok)}
.tls li.c{color:var(--ink);font-weight:700}.tls li.c:before{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--sep);padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;color:var(--hint);font:600 11px var(--f);cursor:pointer;display:grid;justify-items:center;gap:2px;padding:2px 0;position:relative}
.tab[aria-current="page"]{color:var(--accent)}
.dot{position:absolute;top:0;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--hot);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.dot[hidden]{display:none}
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet-bg[hidden]{display:none}
.sheet{width:100%;max-width:480px;max-height:90vh;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:38px;height:5px;border-radius:5px;background:var(--sep);margin:0 auto 12px}
.sheet h3{font-size:20px;margin:6px 0 4px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.meta span{font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--bg)}
.sheet p{color:var(--hint);margin:0 0 12px}
.price{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.lbl{display:block;font-size:13px;font-weight:700;margin:12px 0 7px}
.inp,.msg{width:100%;border:1px solid var(--sep);border-radius:12px;background:var(--bg);color:var(--ink);font:500 15px var(--f);padding:11px 12px}
.msg{min-height:76px;resize:vertical;font-size:14px}
.calc{background:var(--bg);border-radius:12px;padding:12px 14px;margin-top:12px}
.calc .t{display:flex;justify-content:space-between;align-items:baseline}
.calc .t b{font-size:24px;font-variant-numeric:tabular-nums}
.calc .l{display:flex;justify-content:space-between;font-size:13px;color:var(--hint);margin-top:4px;font-variant-numeric:tabular-nums}
.split{display:flex;height:6px;border-radius:6px;overflow:hidden;margin:9px 0 2px}
.split i:first-child{background:var(--ok)}.split i:last-child{background:var(--warn)}
.tog{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;font-weight:600}
.tog span{flex:1}
.main{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:700 16px var(--f);background:var(--accent);color:var(--accent-ink);cursor:pointer;margin-top:14px}
.main.done{background:var(--ok)}
.main:disabled{opacity:.45;cursor:default}
.ghost{display:block;width:100%;border:0;border-radius:12px;padding:12px;font:700 15px var(--f);background:var(--bg);color:var(--ink);cursor:pointer;margin-top:8px}
.view>.ghost{background:var(--card)}
.small{font-size:12px;color:var(--hint);text-align:center;margin:8px 0 0}
/* withdraw keypad, Wallet style */
.amt{text-align:center;font-size:44px;font-weight:800;letter-spacing:-.03em;margin:8px 0 2px;font-variant-numeric:tabular-nums;min-height:58px}
.amt span{font-size:22px;color:var(--hint)}
.amt.bad{color:var(--hot)}
.avail{text-align:center;font-size:13px;color:var(--hint)}
.avail button{background:none;border:0;color:var(--accent);font:700 13px var(--f);cursor:pointer}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.kp button{border:0;background:var(--bg);color:var(--ink);font:700 22px var(--f);border-radius:12px;padding:12px 0;cursor:pointer}
.kp button:active{background:var(--sep)}
.succ{text-align:center;padding:18px 0 4px}
.succ .ck{width:76px;height:76px;border-radius:50%;background:var(--ok);margin:0 auto 14px;display:grid;place-items:center;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
.succ h3{margin:0 0 4px}
.stars{display:flex;justify-content:center;gap:6px;margin:10px 0}
.stars button{background:none;border:0;font-size:34px;color:var(--sep);cursor:pointer;padding:0 2px;line-height:1}
.stars button.on{color:#ffb800}
.mic{border:0;background:var(--bg);border-radius:12px;width:46px;flex:0 0 46px;cursor:pointer;font-size:19px;color:var(--ink)}
.mic.rec{background:var(--hot);color:#fff}
.irow{display:flex;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:rgba(30,30,30,.94);color:#fff;font-size:14px;font-weight:600;padding:10px 16px;border-radius:12px;max-width:90vw;text-align:center}
.toast[hidden]{display:none}
.demo-note{font-size:12px;color:var(--hint);text-align:center;margin-top:6px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* login screen for the installed app (outside Telegram) */
.login{text-align:center;padding-top:max(48px,env(safe-area-inset-top,0px))}
.lg-ic{width:88px;height:88px;display:block;margin:0 auto 14px}
.login h1{font-size:28px;margin:0 0 6px}
.login>p{color:var(--hint);margin:0 auto 22px;max-width:330px}
.lg-w{min-height:48px;display:flex;justify-content:center;margin-bottom:10px}
.lg-lang{display:flex;justify-content:center;gap:6px;margin-top:22px}
.lg-lang button{border:0;background:var(--card);color:var(--hint);font:800 12px var(--f);border-radius:999px;padding:7px 12px;cursor:pointer}
.lg-lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
body.no-tabs .tabs{display:none}
</style></head><body>

<div class="app">

    <img class="lg-ic" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235cc6f7'/%3E%3Cstop offset='1' stop-color='%231c8fd6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='116' fill='url(%23g)'/%3E%3Cpath d='M196 168v-22a30 30 0 0 1 30-30h60a30 30 0 0 1 30 30v22' fill='none' stroke='%23fff' stroke-width='30' stroke-linecap='round'/%3E%3Crect x='108' y='168' width='296' height='220' rx='44' fill='%23fff'/%3E%3Cpath d='M190 280l46 46 92-98' fill='none' stroke='%231c8fd6' stroke-width='36' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

  <section class="view" id="v-home">

      <button class="chip" type="button" id="langBtn" aria-label="Language" style="padding:6px 12px">RU</button></div>
    <div class="seg" role="group" aria-label="Role" id="roleSeg"><button type="button" data-role="student" data-t="r_st"></button><button type="button" data-role="client" data-t="r_cl"></button><button type="button" data-role="curator" data-t="r_cu"></button></div>
    <div id="homeBody"></div>
    <p class="demo-note" data-t="demo"></p>
  </section>

  <section class="view" id="v-orders" hidden>
    <div class="top"><h1 data-t="t_orders"></h1></div>
    <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="color:var(--hint)" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" data-tp="search" aria-label="Search"></label>

    <div class="sort" role="group"><button type="button" data-sort="new" aria-pressed="true" data-t="s_new"></button><button type="button" data-sort="price" aria-pressed="false" data-t="s_price"></button><button type="button" data-sort="soon" aria-pressed="false" data-t="s_soon"></button></div>
    <div class="grp" id="orderList"></div>

  <section class="view" id="v-mine" hidden>
    <div class="top"><h1 id="mineTitle"></h1></div>
    <div id="mineBody"></div>
  </section>
